name: Build Vial Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix Git Permissions
        run: git config --global --add safe.directory '*'

      - name: Clone Vial-QMK and Submodules
        run: git clone --depth=1 --recurse-submodules https://github.com/vial-kb/vial-qmk.git

      - name: Copy and Patch keyboard files
        run: |
          # 1. Tworzymy wymaganą strukturę folderów
          mkdir -p vial-qmk/keyboards/macropad/keymaps/default
          
          # 2. Kopiujemy Twoje pliki z repozytorium
          cp config.h rules.mk vial.json vial-qmk/keyboards/macropad/
          cp keymap.c vial-qmk/keyboards/macropad/keymaps/default/
          
          # 3. Wstrzykujemy brakującą definicję płytki Pico do rules.mk
          echo "BOARD = RPI_PICO" >> vial-qmk/keyboards/macropad/rules.mk
          
          # 4. Generujemy wymagane przez kompilator pliki bazowe klawiatury
          echo '#pragma once' > vial-qmk/keyboards/macropad/macropad.h
          echo '#include "quantum.h"' >> vial-qmk/keyboards/macropad/macropad.h
          echo '#include "macropad.h"' > vial-qmk/keyboards/macropad/macropad.c

      - name: Build Firmware
        run: |
          cd vial-qmk
          make macropad:default

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macropad_firmware
          path: |
            vial-qmk/*.uf2
            vial-qmk/*.bin
