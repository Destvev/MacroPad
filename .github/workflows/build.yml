name: Build Vial Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix Git Permissions
        run: git config --global --add safe.directory '*'

      - name: Clone Vial-QMK and Submodules
        run: git clone --depth=1 --recurse-submodules https://github.com/vial-kb/vial-qmk.git

      - name: Copy keyboard files
        run: |
          mkdir -p vial-qmk/keyboards/macropad
          cp config.h keymap.c rules.mk vial.json vial-qmk/keyboards/macropad/

      - name: Build Firmware
        run: |
          cd vial-qmk
          make macropad:default

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macropad_firmware
          path: vial-qmk/.build/*.uf2
