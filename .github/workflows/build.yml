name: Build Vial Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: Clone Vial-QMK
        run: git clone https://github.com/vial-kb/vial-qmk.git

      - name: Fetch Submodules Deeply
        run: |
          cd vial-qmk
          make git-submodule

      - name: Copy and Patch keyboard files
        run: |
          mkdir -p vial-qmk/keyboards/macropad/keymaps/default
          cp config.h rules.mk info.json vial-qmk/keyboards/macropad/
          cp keymap.c vial-qmk/keyboards/macropad/keymaps/default/
          echo '#pragma once' > vial-qmk/keyboards/macropad/macropad.h
          echo '#include "quantum.h"' >> vial-qmk/keyboards/macropad/macropad.h
          echo '#include "macropad.h"' > vial-qmk/keyboards/macropad/macropad.c

      - name: Build Firmware
        run: |
          cd vial-qmk
          qmk setup -y
          make macropad:default

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macropad_firmware
          path: |
            vial-qmk/*.uf2
