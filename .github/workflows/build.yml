name: Build Vial Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Toolchain and QMK CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi git python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install qmk

      - name: Clone Vial-QMK
        run: |
          git clone https://github.com/vial-kb/vial-qmk.git /home/runner/vial-qmk
          
          # KRYTYCZNY KROK: Zmuszamy QMK CLI do użycia folderu z Vialem!
          qmk config user.qmk_home=/home/runner/vial-qmk
          
          cd /home/runner/vial-qmk
          make git-submodule

      - name: Prepare Keyboard Directory
        run: |
          KEYBOARD_DIR="/home/runner/vial-qmk/keyboards/macropad"
          mkdir -p "$KEYBOARD_DIR/keymaps/default"
          
          cp config.h rules.mk vial.json "$KEYBOARD_DIR/"
          cp keymap.c "$KEYBOARD_DIR/keymaps/default/"
          
          echo '#pragma once' > "$KEYBOARD_DIR/macropad.h"
          echo '#include "quantum.h"' >> "$KEYBOARD_DIR/macropad.h"
          echo '#define LAYOUT_ortho_3x3(k00, k01, k02, k10, k11, k12, k20, k21, k22) { { k00, k01, k02 }, { k10, k11, k12 }, { k20, k21, k22 } }' >> "$KEYBOARD_DIR/macropad.h"
          echo '#include "macropad.h"' > "$KEYBOARD_DIR/macropad.c"

      - name: Build Firmware
        run: |
          cd /home/runner/vial-qmk
          qmk compile -kb macropad -km default

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macropad_firmware
          path: /home/runner/vial-qmk/*.uf2
