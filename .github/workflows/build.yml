name: Build Vial Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix Git Permissions
        run: git config --global --add safe.directory '*'

      - name: Clone Vial-QMK and Submodules
        run: git clone --depth=1 --recurse-submodules https://github.com/vial-kb/vial-qmk.git

      - name: Copy and Patch keyboard files
        run: |
          # 1. Create required folder structure
          mkdir -p vial-qmk/keyboards/macropad/keymaps/vial
          
          # 2. Copy files from the repository
          cp config.h keyboard.json rules.mk vial-qmk/keyboards/macropad/
          cp keymaps/vial/keymap.c keymaps/vial/config.h keymaps/vial/rules.mk keymaps/vial/vial.json vial-qmk/keyboards/macropad/keymaps/vial/
          
          # 3. Add ast.Constant support to QMK (Python 3.12+ uses ast.Constant for numeric literals)
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vial-qmk/lib/python/qmk/math.py")
          lines = path.read_text().splitlines()
          if not any("ast.Constant" in line for line in lines):
              for index, line in enumerate(lines):
                  if "isinstance(node, ast.Num)" in line:
                      indent = line.split("if", 1)[0]
                      lines.insert(index, f"{indent}if isinstance(node, ast.Constant):  # <number>")
                      lines.insert(index + 1, f"{indent}    return node.value")
                      break
              path.write_text("\n".join(lines) + "\n")
          PY
          
          # 4. Generate base keyboard files required by the compiler
          echo '#pragma once' > vial-qmk/keyboards/macropad/macropad.h
          echo '#include "quantum.h"' >> vial-qmk/keyboards/macropad/macropad.h
          echo '#include "macropad.h"' > vial-qmk/keyboards/macropad/macropad.c

      - name: Build Firmware
        run: |
          cd vial-qmk
          make macropad:vial

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macropad_firmware
          path: |
            vial-qmk/*.uf2
            vial-qmk/*.bin
