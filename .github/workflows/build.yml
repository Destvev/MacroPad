name: Build Vial Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix Git Permissions
        run: git config --global --add safe.directory '*'

      - name: Clone Vial-QMK and Submodules
        run: git clone --depth=1 --recurse-submodules https://github.com/vial-kb/vial-qmk.git

      - name: Copy and Patch keyboard files
        run: |
          # 1. Tworzymy wymaganą strukturę folderów
          mkdir -p vial-qmk/keyboards/macropad/keymaps/vial
          
          # 2. Kopiujemy Twoje pliki z repozytorium
          cp config.h keyboard.json rules.mk vial-qmk/keyboards/macropad/
          cp keymaps/vial/keymap.c keymaps/vial/config.h keymaps/vial/rules.mk keymaps/vial/vial.json vial-qmk/keyboards/macropad/keymaps/vial/
          
          # 3. Uzupełniamy QMK o obsługę ast.Constant (Python 3.12+)
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vial-qmk/lib/python/qmk/math.py")
          text = path.read_text()
          if "ast.Constant" not in text:
              text = text.replace(
                  "def _eval(node):\\n    if isinstance(node, ast.Num):  # <number>\\n        return node.n",
                  "def _eval(node):\\n    if isinstance(node, ast.Constant):  # <number>\\n        return node.value\\n    if isinstance(node, ast.Num):  # <number>\\n        return node.n",
              )
              path.write_text(text)
          PY
          
          # 4. Generujemy wymagane przez kompilator pliki bazowe klawiatury
          echo '#pragma once' > vial-qmk/keyboards/macropad/macropad.h
          echo '#include "quantum.h"' >> vial-qmk/keyboards/macropad/macropad.h
          echo '#include "macropad.h"' > vial-qmk/keyboards/macropad/macropad.c

      - name: Build Firmware
        run: |
          cd vial-qmk
          make macropad:vial

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macropad_firmware
          path: |
            vial-qmk/*.uf2
            vial-qmk/*.bin
