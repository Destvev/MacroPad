name: Build Vial Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Clone Vial-QMK and Submodules
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          cd vial-qmk
          git submodule update --init --recursive --depth=1

      - name: Prepare Keyboard Directory
        run: |
          mkdir -p vial-qmk/keyboards/macropad/keymaps/default
          cp config.h rules.mk vial.json vial-qmk/keyboards/macropad/
          cp keymap.c vial-qmk/keyboards/macropad/keymaps/default/
          
          # Tworzymy pliki strukturalne i wstrzykujemy makro układu przycisków
          echo '#pragma once' > vial-qmk/keyboards/macropad/macropad.h
          echo '#include "quantum.h"' >> vial-qmk/keyboards/macropad/macropad.h
          echo '#define LAYOUT_ortho_3x3(k00, k01, k02, k10, k11, k12, k20, k21, k22) { { k00, k01, k02 }, { k10, k11, k12 }, { k20, k21, k22 } }' >> vial-qmk/keyboards/macropad/macropad.h
          echo '#include "macropad.h"' > vial-qmk/keyboards/macropad/macropad.c

      - name: Build Firmware
        run: |
          cd vial-qmk
          make macropad:default

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macropad_firmware
          path: vial-qmk/*.uf2
